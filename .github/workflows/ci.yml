name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: medimind
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: medimind_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      working-directory: ./backend
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test with pytest
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+psycopg://medimind:password123@localhost:5432/medimind_test_db
        JWT_SECRET: supersecretkey
        GEMINI_API_KEY: mock_ci_key
      run: |
        pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Start services with Docker Compose
      env:
        GEMINI_API_KEY: "mock_ci_key"
        OPENAI_API_KEY: "mock_ci_key"
        JWT_SECRET: "supersecretkey"
      run: docker compose up -d --build
    - name: Wait for services to be ready
      run: sleep 15
    - name: Initialize Database
      run: docker compose exec -T backend python init_db.py
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "22.x"
    - name: Install Playwright and dependencies
      working-directory: ./frontend
      run: |
        npm ci
        npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./frontend
      run: npx playwright test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker images
      run: docker compose build
